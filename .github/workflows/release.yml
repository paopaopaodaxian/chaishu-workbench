name: 发布

# 修改 VERSION 并推送到 main 后，在 macOS 上打包并发布：
#   ChaiShu-<版本>-macOS.dmg  Mac 用户下载这个
#   ChaiShu-<版本>.zip        Windows / Linux（从源码运行）
# 版本号已经发布过时会跳过。也可以在 Actions 页面手动运行。
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      republish:
        description: "重新发布当前版本（删除已有的同版本 Release 和标签后重建）"
        type: boolean
        default: false
      dry_run:
        description: "只打包、不发布（产物在本次运行的 Artifacts 里）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 清理之前试跑留下的草稿版本
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 50 --json tagName,isDraft --jq '.[] | select(.isDraft and (.tagName | startswith("test-"))) | .tagName' \
            | while read -r t; do gh release delete "$t" --yes || true; done

      - name: 需要时删除已有的同版本发布
        if: github.event_name == 'workflow_dispatch' && inputs.republish && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d ' \n' < VERSION)"
          gh release delete "v$v" --yes --cleanup-tag || true
          git tag -d "v$v" 2>/dev/null || true

      - name: 读取版本号
        id: ver
        run: |
          v="$(tr -d ' \n' < VERSION)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$v" >/dev/null 2>&1 && [ "${{ inputs.dry_run }}" != "true" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$v 已经发布过，跳过"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 语法检查
        if: steps.ver.outputs.exists == 'false'
        run: |
          python3 -m py_compile server.py core/*.py
          bash -n macos/launcher

      - name: 打包 Mac 应用
        if: steps.ver.outputs.exists == 'false'
        run: scripts/build_macos_app.sh "${{ steps.ver.outputs.version }}"

      - name: 制作 dmg
        if: steps.ver.outputs.exists == 'false'
        run: |
          v="${{ steps.ver.outputs.version }}"
          python3 -m venv .venv && .venv/bin/pip install --quiet dmgbuild
          tiffutil -cathidpicheck macos/dmg-background.png macos/dmg-background@2x.png -out dist/dmg-background.tiff
          .venv/bin/dmgbuild -s macos/dmg_settings.py \
            -D app="dist/拆书工作台.app" -D background=dist/dmg-background.tiff \
            "拆书工作台" "dist/ChaiShu-$v-macOS.dmg"
          hdiutil verify "dist/ChaiShu-$v-macOS.dmg"

      - name: 打包通用版 zip
        if: steps.ver.outputs.exists == 'false'
        run: scripts/build_source_zip.sh "${{ steps.ver.outputs.version }}"

      - name: 验证 dmg 内容并实际启动应用
        if: steps.ver.outputs.exists == 'false'
        run: |
          set -x
          v="${{ steps.ver.outputs.version }}"
          dmg="dist/ChaiShu-$v-macOS.dmg"
          mnt="$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | cut -f3)"
          ls -la "$mnt" "$mnt/.background" || true
          test -L "$mnt/Applications"
          test -f "$mnt/.DS_Store"
          test -x "$mnt/拆书工作台.app/Contents/MacOS/launcher"
          echo "::notice title=dmg 内容::$(ls -A "$mnt" | tr '\n' ' ')"
          ditto "$mnt/拆书工作台.app" "/Applications/拆书工作台.app"
          hdiutil detach "$mnt"
          # 像用户一样打开 dmg 窗口并截图
          open "$dmg"; sleep 6
          screencapture -x dist/dmg-window.png || true
          # 实际启动应用，确认服务和页面正常
          open "/Applications/拆书工作台.app"
          for i in $(seq 1 60); do curl -s -m 2 http://127.0.0.1:8765/api/ping && break; sleep 1; done
          ping="$(curl -s -m 3 http://127.0.0.1:8765/api/ping)"
          page="$(curl -s -m 3 -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/)"
          echo "::notice title=启动结果::ping=$ping page=$page"
          test "$page" = "200"
          echo "$ping" | grep -q "\"version\": \"$v\""
          [ "$(uname -m)" != "arm64" ] || echo "$ping" | grep -q '"arch": "arm64"'
          curl -s -m 3 -X POST -d '{}' http://127.0.0.1:8765/api/shutdown || true

      - name: 试跑产物放进草稿版本（仅仓库主人可见）
        if: steps.ver.outputs.exists == 'false' && inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: 试跑 ${{ github.run_number }}（草稿，可删除）
          draft: true
          files: |
            dist/ChaiShu-${{ steps.ver.outputs.version }}-macOS.dmg
            dist/ChaiShu-${{ steps.ver.outputs.version }}.zip
            dist/dmg-window.png

      - name: 发布
        if: steps.ver.outputs.exists == 'false' && !inputs.dry_run
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: 拆书工作台 v${{ steps.ver.outputs.version }}
          files: |
            dist/ChaiShu-${{ steps.ver.outputs.version }}-macOS.dmg
            dist/ChaiShu-${{ steps.ver.outputs.version }}.zip
          body: |
            **Mac**：下载 `ChaiShu-${{ steps.ver.outputs.version }}-macOS.dmg`，打开后把「拆书工作台」拖进「应用程序」。第一次打开会被拦，见 README 的安装部分。

            **Windows / Linux**：下载 `ChaiShu-${{ steps.ver.outputs.version }}.zip`，解压后 Windows 双击 `start-windows.bat`，Linux 运行 `start.sh`。需要 Python 3.9+。
          generate_release_notes: true
