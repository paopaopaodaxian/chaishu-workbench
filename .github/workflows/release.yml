name: 发布

# 修改 VERSION 文件并推送到 main 后，自动打包 macOS 应用，创建 v<版本号> 标签和 Release。
# 版本号已经发布过时会跳过。也可以在 Actions 页面手动运行。
on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:
    inputs:
      republish:
        description: "重新发布当前版本（删除已有的同版本 Release 和标签后重建）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 需要时删除已有的同版本发布
        if: github.event_name == 'workflow_dispatch' && inputs.republish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(tr -d ' \n' < VERSION)"
          gh release delete "v$v" --yes --cleanup-tag || true
          git tag -d "v$v" 2>/dev/null || true

      - name: 读取版本号
        id: ver
        run: |
          v="$(tr -d ' \n' < VERSION)"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$v" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$v 已经发布过，跳过"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 语法检查
        if: steps.ver.outputs.exists == 'false'
        run: |
          python3 -m py_compile server.py core/*.py
          bash -n macos/launcher

      - name: 打包
        if: steps.ver.outputs.exists == 'false'
        run: scripts/build_macos_app.sh "${{ steps.ver.outputs.version }}"

      - name: 发布
        if: steps.ver.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: 拆书工作台 v${{ steps.ver.outputs.version }}
          files: dist/*.zip
          body: |
            下载 `ChaiShu-${{ steps.ver.outputs.version }}-macOS.zip`，解压后把「拆书工作台」拖进「应用程序」。第一次打开会被拦，见 README 的安装部分。
          generate_release_notes: true
